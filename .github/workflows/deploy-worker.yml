name: Implantar Worker portal
on:
  workflow_dispatch:
    inputs:
      confirmacao: { description: 'Digite IMPLANTAR-WORKER-PORTAL', required: true, type: string }
permissions: { contents: read }
concurrency: { group: portal-production, cancel-in-progress: false }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmacao == 'IMPLANTAR-WORKER-PORTAL'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: test "$GITHUB_REF" = refs/heads/main && test "$CONFIRMACAO" = IMPLANTAR-WORKER-PORTAL
        env: { CONFIRMACAO: '${{ inputs.confirmacao }}' }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run dry-run
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
      - name: "Resumo do dry-run"
        run: |
          {
            echo "### Worker portal"
            echo
            echo "Branch: \`${GITHUB_REF_NAME}\`"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "Dry-run aprovado. Ambiente protegido liberou o deploy."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm exec --yes --package=wrangler@4.35.0 -- wrangler deploy
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
