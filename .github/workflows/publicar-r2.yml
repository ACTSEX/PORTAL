name: Bootstrap e publicação R2
on:
  workflow_dispatch:
    inputs:
      modo: { description: 'check local; plan remoto somente leitura; apply create-only', required: true, default: check, type: choice, options: [check, plan, apply] }
      confirmacao: { description: 'Apply: PUBLICAR-V2-NO-R2', required: false, type: string }
      entrada_cliente: { description: 'Deve permanecer vazio no bootstrap', required: false, type: string }
permissions: { contents: read }
concurrency: { group: portal-r2-production, cancel-in-progress: false }
jobs:
  r2:
    environment: production-r2
    runs-on: ubuntu-latest
    env:
      REPORT_PATH: reports/bootstrap-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:config
      - name: Check local (sem rede ou secrets)
        if: inputs.modo == 'check'
        run: node scripts/bootstrap-r2.mjs check
      - name: Plan remoto somente leitura
        if: inputs.modo == 'plan'
        run: node scripts/bootstrap-r2.mjs plan
        env:
          R2_ACCESS_KEY_ID: '${{ secrets.R2_ACCESS_KEY_ID }}'
          R2_SECRET_ACCESS_KEY: '${{ secrets.R2_SECRET_ACCESS_KEY }}'
          AWS_ACCESS_KEY_ID: '${{ secrets.R2_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.R2_SECRET_ACCESS_KEY }}'
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
      - name: Inventário remoto anterior e criação condicional
        if: inputs.modo == 'apply'
        run: node scripts/bootstrap-r2.mjs apply
        env:
          R2_ACCESS_KEY_ID: '${{ secrets.R2_ACCESS_KEY_ID }}'
          R2_SECRET_ACCESS_KEY: '${{ secrets.R2_SECRET_ACCESS_KEY }}'
          AWS_ACCESS_KEY_ID: '${{ secrets.R2_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.R2_SECRET_ACCESS_KEY }}'
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          CONFIRMATION: '${{ inputs.confirmacao }}'
          ENTRADA_CLIENTE: '${{ inputs.entrada_cliente }}'
      - name: Resumo seguro
        if: always() && hashFiles('reports/bootstrap-report.json') != ''
        shell: bash
        run: |
          node -e '
            const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.env.REPORT_PATH));
            const existing=r.counts.existente_igual+r.counts.existente_diferente;
            const lines=["### Bootstrap R2",`Modo: \`${r.mode}\``,`Branch: \`${r.branch||process.env.GITHUB_REF_NAME}\``,`Commit: \`${r.commit||process.env.GITHUB_SHA}\``,`Objetos: ${r.total}`,`Ausentes: ${r.counts.ausente}`,`Existentes: ${existing}`,`Iguais: ${r.counts.existente_igual}`,`Diferentes: ${r.counts.existente_diferente}`,`Remote reads: ${r.remoteReads}`,`Writes: ${r.writes}`,`Deletes: ${r.deletes}`,`Overwrites: ${r.overwrites}`,`Resultado: \`${r.resultado}\``,`Artifact: \`relatorio-r2/bootstrap-report.json\``];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");'
      - name: Anexar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: relatorio-r2, path: 'reports/bootstrap-report.json', if-no-files-found: warn }
