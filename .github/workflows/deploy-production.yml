name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY para confirmar a publicação em produção'
        required: true
        type: string
      minisite_slug:
        description: 'Slug de um minisite existente para smoke test (opcional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 1. Validate branch and confirmation
        shell: bash
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          MINISITE_SLUG: ${{ inputs.minisite_slug }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ABORTAR: produção somente pode ser publicada a partir de main." >&2
            exit 1
          fi
          if [[ "$DEPLOY_CONFIRMATION" != "DEPLOY" ]]; then
            echo "ABORTAR: confirmação inválida." >&2
            exit 1
          fi
          if [[ -n "$MINISITE_SLUG" && ! "$MINISITE_SLUG" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "ABORTAR: minisite_slug inválido." >&2
            exit 1
          fi

      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Record commit and clean checkout
        id: checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          test -z "$(git status --short)"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 2. Install
        id: install
        run: npm ci

      - name: 3. Lint
        id: lint
        run: npm run lint

      - name: 4. Tests
        id: tests
        run: npm test

      - name: 5. Audit
        id: audit
        run: npm audit --audit-level=moderate

      - name: Check Git diff
        id: diff
        run: git diff --check

      - name: Validate Cloudflare secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "DEPLOY NÃO CONCLUÍDO: configure os secrets Cloudflare no GitHub." >&2
            exit 1
          fi

      - name: 6. Cloudflare identity
        id: identity
        run: npx wrangler whoami

      - name: 7. List migrations before backup
        id: migrations_before
        run: npx wrangler d1 migrations list ACTS_DB --remote --env production

      - name: 8. Backup D1
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          backup_dir=/tmp/acts-backup
          timestamp=$(date -u +'%Y%m%dT%H%M%SZ')
          short_sha=${GITHUB_SHA:0:12}
          backup_file="$backup_dir/portal-db-${timestamp}-${short_sha}.sql"
          install -d -m 700 "$backup_dir"
          npx wrangler d1 export ACTS_DB --remote --env production --output "$backup_file" --skip-confirmation
          test -s "$backup_file"
          chmod 600 "$backup_file"
          echo "path=$backup_file" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$backup_file")" >> "$GITHUB_OUTPUT"
          echo "Backup D1 criado e validado fora da árvore do Git."

      - name: Upload encrypted-at-rest D1 backup artifact
        id: backup_artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-db-production-backup-${{ github.run_id }}
          path: ${{ steps.backup.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: 9. Apply migrations
        id: migrations_apply
        run: npx wrangler d1 migrations apply ACTS_DB --remote --env production

      - name: 10. Verify migrations
        id: migrations_after
        shell: bash
        run: |
          set -euo pipefail
          output_file=$(mktemp)
          trap 'rm -f "$output_file"' EXIT
          npx wrangler d1 migrations list ACTS_DB --remote --env production | tee "$output_file"
          if ! grep -Fq 'No migrations to apply!' "$output_file"; then
            echo "DEPLOY NÃO CONCLUÍDO: ainda há migrations pendentes ou o ledger não pôde ser confirmado." >&2
            exit 1
          fi

      - name: Generate production types
        id: types
        run: npx wrangler types .wrangler/tmp/production.d.ts --env production

      - name: 11. Dry-run
        id: dry_run
        run: npx wrangler deploy --dry-run --env production

      - name: 12. Deploy
        id: deploy
        run: npx wrangler deploy --env production

      - name: 13. Smoke test portal, headers and private shells
        id: portal_smoke
        shell: bash
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT

          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --dump-header "$work_dir/apex.headers" \
            --output "$work_dir/apex.body" \
            https://imobiliarista.net/
          test -s "$work_dir/apex.body"

          for header in x-content-type-options referrer-policy permissions-policy content-security-policy strict-transport-security; do
            if ! grep -Eiq "^${header}:" "$work_dir/apex.headers"; then
              echo "DEPLOY NÃO CONCLUÍDO: header obrigatório ausente: $header" >&2
              exit 1
            fi
          done

          for path in admin painel; do
            status=$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --dump-header "$work_dir/${path}.headers" \
              --output "$work_dir/${path}.body" \
              --write-out '%{http_code}' \
              "https://imobiliarista.net/${path}")
            if [[ "$status" -ge 500 ]]; then
              echo "DEPLOY NÃO CONCLUÍDO: /${path} respondeu HTTP $status." >&2
              exit 1
            fi
            if ! grep -Eiq '^cache-control:[[:space:]]*no-store([[:space:]]|$|,)' "$work_dir/${path}.headers"; then
              echo "DEPLOY NÃO CONCLUÍDO: /${path} não retornou Cache-Control: no-store." >&2
              exit 1
            fi
          done

          api_status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 45 \
            --dump-header "$work_dir/admin-api.headers" \
            --output "$work_dir/admin-api.body" \
            --write-out '%{http_code}' \
            https://imobiliarista.net/api/admin/)
          if [[ "$api_status" != "401" && "$api_status" != "403" ]]; then
            echo "DEPLOY NÃO CONCLUÍDO: API administrativa sem sessão respondeu HTTP $api_status." >&2
            exit 1
          fi
          if grep -Eiq '^access-control-allow-origin:[[:space:]]*\*' "$work_dir/admin-api.headers"; then
            echo 'DEPLOY NÃO CONCLUÍDO: API administrativa permite CORS wildcard.' >&2
            exit 1
          fi

      - name: Smoke test minisite and host isolation
        id: minisite_smoke
        if: ${{ inputs.minisite_slug != '' }}
        shell: bash
        env:
          MINISITE_SLUG: ${{ inputs.minisite_slug }}
        run: |
          set -euo pipefail
          origin="https://${MINISITE_SLUG}.imobiliarista.net"
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 --output "$body" "$origin/"
          test -s "$body"

          for path in /admin /painel /api/admin/; do
            status=$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --output /dev/null --write-out '%{http_code}' "$origin$path")
            if [[ "$status" != "404" ]]; then
              echo "DEPLOY NÃO CONCLUÍDO: isolamento falhou em $path (HTTP $status; esperado 404)." >&2
              exit 1
            fi
          done

      - name: Report skipped minisite smoke
        if: ${{ inputs.minisite_slug == '' }}
        run: echo 'SKIP MINISITE SMOKE — nenhum slug seguro foi informado.'

      - name: Production deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          MINISITE_SLUG: ${{ inputs.minisite_slug }}
        run: |
          {
            echo '# Production deployment'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Backup: \`${{ steps.backup.outcome }}\` (artifact retido por 14 dias quando criado)"
            echo "- Migrations: \`${{ steps.migrations_apply.outcome }}\`; verificação: \`${{ steps.migrations_after.outcome }}\`"
            echo "- Dry-run: \`${{ steps.dry_run.outcome }}\`"
            echo "- Deploy: \`${{ steps.deploy.outcome }}\`"
            echo "- Portal smoke e headers: \`${{ steps.portal_smoke.outcome }}\`"
            if [[ -n "$MINISITE_SLUG" ]]; then
              echo "- Minisite smoke: \`${{ steps.minisite_smoke.outcome }}\`"
            else
              echo '- Minisite smoke: `SKIPPED — slug não informado`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
