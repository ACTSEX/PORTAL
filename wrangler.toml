name = "acts-portal"
pages_build_output_dir = "site"
compatibility_date = "2026-07-31"

# IDs are non-secret placeholders required by Wrangler. Replace them with the
# IDs of resources provisioned independently for each environment before deploy.
[[d1_databases]]
binding = "ACTS_DB"
database_name = "acts-portal-development"
database_id = "00000000-0000-0000-0000-000000000001"

[[kv_namespaces]]
binding = "ACTS_KV"
id = "00000000000000000000000000000001"

[[r2_buckets]]
binding = "ACTS_FILES"
bucket_name = "acts-portal-development"

[[queues.producers]]
binding = "ACTS_QUEUE"
queue = "acts-portal-development"

