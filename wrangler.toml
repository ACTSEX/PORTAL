name = "portal"
main = "worker/index.js"
compatibility_date = "2026-07-31"
workers_dev = false

# Resource bindings intentionally remain unconfigured. When real resources are
# provisioned, retain these established binding names and migration location:
# D1: ACTS_DB (migrations_dir = "database/migrations")
# KV: ACTS_KV
# R2: ACTS_FILES
# Queue producer: ACTS_QUEUE

# Environments are retained for local/deployment workflows, but do not declare
# resource bindings until their real Cloudflare resources have been provisioned.
[env.development]
name = "portal-development"

[env.staging]
name = "portal-staging"

[env.production]
name = "portal"
