name = "portal"
main = "worker/index.js"
compatibility_date = "2026-07-31"
workers_dev = false

[[routes]]
pattern = "acompanhantesex.com"
custom_domain = true

[[routes]]
pattern = "*.acompanhantesex.com/*"
zone_name = "acompanhantesex.com"

[[d1_databases]]
binding = "ACTS_DB"
database_name = "portal-db"
database_id = "9b095e00-ad71-46c9-a33f-e9f67000e104"
migrations_dir = "database/migrations"

[[r2_buckets]]
binding = "ACTS_MEDIA"
bucket_name = "acts-midias"

[[r2_buckets]]
binding = "ACTS_DATA"
bucket_name = "acts-dados"

[[queues.producers]]
binding = "ACTS_QUEUE"
queue = "acts-queues"

